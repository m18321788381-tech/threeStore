# 安全响应头片段。
#
# Nginx 继承规则：一旦某个 location 内部出现 add_header，server 层的 add_header
# 会被**全部丢弃**。因此凡是带 add_header 的 location 都必须再 include 一次本文件，
# 否则该 location 下的响应将失去所有安全头（这是很容易踩的坑）。
#
# HSTS 未包含在此文件：站点当前尚未启用 HTTPS，提前下发 HSTS 会导致浏览器
# 强制跳转到一个不存在的 HTTPS 端点、且短时间内无法回退。
# 启用 HTTPS 后，在 ssl server 块中追加：
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# XSS 防护：Next.js 依赖内联脚本与 eval，因此 script-src 需放宽 unsafe-inline / unsafe-eval。
# 后续可改用 nonce 方案进一步收紧。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
