upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

# ---------------------------- HTTP :80 ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    # Let's Encrypt 校验目录（HTTP-01）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        image/svg+xml application/atom+xml;

    # ---- 媒体文件：长缓存直接落盘（与 compose 中的 media_data 卷挂载点一致） ----
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- SEO：RSS / Sitemap 直接由后端产出 ----
    location = /feed.xml {
        proxy_pass http://backend_upstream/feed.xml;
        proxy_set_header Host $host;
        add_header Content-Type "application/rss+xml; charset=utf-8";
    }

    location = /sitemap.xml {
        proxy_pass http://backend_upstream/sitemap.xml;
        proxy_set_header Host $host;
        add_header Content-Type "application/xml";
    }

    # ---- Next.js 静态资源：长缓存 ----
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 其余全部交给前端 ----
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
