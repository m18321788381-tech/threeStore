upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

# ---------------------------- HTTP :80 ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    # ---- 安全响应头（注意：location 内若出现 add_header 需重新 include）----
    include /etc/nginx/snippets/security-headers.conf;

    # Let's Encrypt 校验目录（HTTP-01）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        image/svg+xml application/atom+xml;

    # ---- 媒体文件：长缓存直接落盘（与 compose 中的 media_data 卷挂载点一致）----
    # 用户上传目录风险高于站点自身资源：额外下发沙箱 CSP，
    # 即便存在可携带脚本的 SVG，也无法在站点上下文中执行。
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- 后端 API ----
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- SEO：RSS / Sitemap 由后端产出 ----
    # 后端 meta 路由挂在 /api/v1 前缀下，真实路径是 /api/v1/feed.xml。
    # 此前转发到 /feed.xml 因路径不匹配，导致两个 SEO 入口长期 404。
    location = /feed.xml {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend_upstream/api/v1/feed.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend_upstream/api/v1/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Next.js 静态资源：长缓存 ----
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- 其余全部交给前端 ----
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
